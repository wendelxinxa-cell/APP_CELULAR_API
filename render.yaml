services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: Stipop__ApiKey
        sync: false
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "26"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_26.apk"
      - key: AppUpdate__Sha256
        value: "9CFC1BED904E3F01391D0CD21AFABD6E331FC911DA181F433C83910CA8F2F22C"
      - key: AppUpdate__Notes
        value: "ChatCat build 26: sincronização incremental do chat; mantém mensagens e mídias antigas no aparelho e baixa somente novas mensagens."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



