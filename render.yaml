services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "15"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_15.apk"
      - key: AppUpdate__Sha256
        value: "58BB18D43EE8E3C0B7B92ACD79995AF6CFDC5491CCC52C08A14F3F810E04DB9A"
      - key: AppUpdate__Notes
        value: "ChatCat: estrela e raio com animação e vibração; wink entregue como ação temporária, sem registro no histórico da conversa."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



