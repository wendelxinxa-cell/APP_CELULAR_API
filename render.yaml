services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "12"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_12.apk"
      - key: AppUpdate__Sha256
        value: "0A09DA0C57BA89505AE33CD3EB09ACF30FD819B0689C0FD32B96A8B7542DC6C0"
      - key: AppUpdate__Notes
        value: "ChatCat: aprovações identificam usuário e aparelho; cada troca libera um único aparelho e invalida as outras solicitações pendentes do usuário."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



