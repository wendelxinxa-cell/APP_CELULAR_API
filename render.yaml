services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "13"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_13.apk"
      - key: AppUpdate__Sha256
        value: "B0DB7E42FA93347614CA423D0A0A0C3D0884711C53BD05D884546F6C824C06F3"
      - key: AppUpdate__Notes
        value: "ChatCat: ações de atenção e wink com animação independente da vibração, envio direto e aviso de pendência; atualização da conversa mais rápida."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



