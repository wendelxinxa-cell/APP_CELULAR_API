services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: Stipop__ApiKey
        sync: false
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "20"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_20.apk"
      - key: AppUpdate__Sha256
        value: "E890D24A49F9270AC435F1FCF1C4CE1FAB364BA430CA6CC433007D124CEB845D"
      - key: AppUpdate__Notes
        value: "ChatCat: novas paletas de cores, figurinhas Stipop, melhorias no chat, efeito LED de borda com o gato do app, proteção do histórico com senha da conta e ajustes dos menus de conversa."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



