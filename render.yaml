services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: Stipop__ApiKey
        sync: false
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "21"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_21.apk"
      - key: AppUpdate__Sha256
        value: "B7868B04ABBBA3CB157E7B005C7FE4F779D971827EC07BB2D68342AAE0390797"
      - key: AppUpdate__Notes
        value: "ChatCat build 21: mensagens ocultas com cadeado sem criptografia, rolagem corrigida e melhorias no efeito do gato; mantém as paletas, figurinhas e ajustes de conversa."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



