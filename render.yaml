services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "17"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_17.apk"
      - key: AppUpdate__Sha256
        value: "FB785257AC1F95366F33319A156E9539BAB0185041FDC954E8923CA919328FCA"
      - key: AppUpdate__Notes
        value: "ChatCat: figurinhas enviadas como mensagem com animação e neon; raio e estrela com três pulsos sincronizados."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



