services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: Stipop__ApiKey
        sync: false
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "23"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_23.apk"
      - key: AppUpdate__Sha256
        value: "B01564B69BA75680C19A1A2B3CD72F45EE8D5D842F34A02686736F8717BF78D5"
      - key: AppUpdate__Notes
        value: "ChatCat build 23: envio imediato de mensagens com status e rolagem automática no chat."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



