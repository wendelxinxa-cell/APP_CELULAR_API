services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.008"
      - key: AppUpdate__Build
        value: "8"
      - key: AppUpdate__FileName
        value: "APP_CELULAR_0.0.008_build_8.apk"
      - key: AppUpdate__Sha256
        value: "751140E7EC411C39A219CB9AAF0604CC48044B199FB01BD82B44F2EA03F82536"
      - key: AppUpdate__Notes
        value: "Chat com personalização, emojis e paletas em todas as telas."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"

