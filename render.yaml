services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: Stipop__ApiKey
        sync: false
      - key: AppUpdate__Version
        value: "0.0.001"
      - key: AppUpdate__Build
        value: "18"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.001_build_18.apk"
      - key: AppUpdate__Sha256
        value: "6F931638045703FEB2D661E7B54C2A5E97A5A79768A90E2A197E5634BB6ACA20"
      - key: AppUpdate__Notes
        value: "ChatCat: novas paletas de cores, figurinhas Stipop, melhorias no chat e na experiência do aplicativo."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



