services:
  - type: web
    name: app-celular-api
    runtime: docker
    plan: free
    dockerfilePath: ./APP_CELULAR_API/Dockerfile
    dockerContext: ./APP_CELULAR_API
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: Empresas__1
        value: SupabaseEmpresa1
      - key: ConnectionStrings__SupabaseEmpresa1
        sync: false
      - key: ConnectionStrings__CadastroCentral
        sync: false
      - key: ChatCentral__Ativo
        value: "false"
      - key: AppUpdate__Version
        value: "0.0.009"
      - key: AppUpdate__Build
        value: "9"
      - key: AppUpdate__FileName
        value: "CHATCAT_0.0.009_build_9.apk"
      - key: AppUpdate__Sha256
        value: "8918C376A4ECF7559465949F02848C28FC22B307DB3F8A4D8493C726E940B0E6"
      - key: AppUpdate__Notes
        value: "ChatCat com Winks, pacotes personalizados, som e novo ícone."
      - key: MasterAdmin__Username
        sync: false
      - key: MasterAdmin__PasswordHash
        sync: false
      - key: MasterAdmin__EncryptionKey
        sync: false
      - key: MasterAdmin__Email
        sync: false
      - key: Email__SmtpHost
        sync: false
      - key: Email__SmtpPort
        value: "587"
      - key: Email__Username
        sync: false
      - key: Email__Password
        sync: false
      - key: Email__FromAddress
        sync: false
      - key: Email__EnableSsl
        value: "true"



